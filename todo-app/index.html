<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>📋 Mi Lista de Tareas</title>
    <link rel="stylesheet" href="styles.css">
</head>
<body>
    <div class="container">
        <header>
            <h1>📋 Mi Lista de Tareas</h1>
            <p class="subtitle">Organiza tu día de forma sencilla</p>
        </header>

        <div class="input-section">
            <input 
                type="text" 
                id="taskInput" 
                class="task-input" 
                placeholder="Escribe una nueva tarea..."
                autocomplete="off"
            >
            <button id="addBtn" class="add-btn">+ Agregar</button>
        </div>

        <div class="stats">
            <span class="stat">Total: <span id="totalCount">0</span></span>
            <span class="stat">Completadas: <span id="completedCount">0</span></span>
            <span class="stat">Pendientes: <span id="pendingCount">0</span></span>
        </div>

        <div class="filter-buttons">
            <button class="filter-btn active" data-filter="all">Todas</button>
            <button class="filter-btn" data-filter="active">Pendientes</button>
            <button class="filter-btn" data-filter="completed">Completadas</button>
        </div>

        <ul id="taskList" class="task-list"></ul>

        <div id="emptyState" class="empty-state">
            <p>📝 No hay tareas. ¡Comienza a añadir una!</p>
        </div>

        <div class="actions">
            <button id="clearBtn" class="clear-btn">🗑️ Limpiar completadas</button>
        </div>
    </div>

    <script src="script.js"></script>
</body>
</html>
